# SPDX-License-Identifier: Apache-2.0

name: "800: [CALL] License Headers"
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go Version:"
        type: string
        required: false
        default: "1.27.1"
      task-version:
        description: "Task Version:"
        type: string
        required: false
        default: "3.39.2"
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "License Headers"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  license-headers:
    name: "${{ inputs.custom-job-label || 'License Headers' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GoLang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ inputs.go-version || '1.27.1' }}
          check-latest: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ inputs.task-version || '3.39.2' }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # CI runs the same task as local development. The task installs
      # license-eye with `go install` at LICENSE_EYE_VERSION, pinned only in
      # Taskfile.yaml, instead of using the apache/skywalking-eyes action,
      # whose action.yml references actions by tag.
      - name: Check License Headers
        run: task lint:license
